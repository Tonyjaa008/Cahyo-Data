name: Auto Sync Data Pasaran

on:
  schedule:
    # Jalan otomatis tiap 5 menit dari 11:00 WIB s/d 01:59 WIB (12:00 - 02:59 WITA)
    - cron: '*/5 4-18 * * *'
  workflow_dispatch:

concurrency:
  group: auto-sync-data-pasaran
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Library (Termasuk curl_cffi Anti-Blokir)
        run: pip install curl_cffi requests beautifulsoup4 lxml

      - name: 4. Jalankan Bot Sinkronisasi 11 Pasaran
        run: python sync_data.py

      - name: 5. Simpan data.json Jika Ada Angka Baru
        run: |
          if [ -f data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto update data pasaran"
              git push
            else
              echo "Belum ada perubahan angka baru."
            fi
          fi
